[package]
name = "engenho-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "engenho-config — the top-level shikumi-back typed configuration surface for the whole engenho substrate. EngenhoConfig owns cluster + revoada + teia + scheduler + controllers + consistency sub-structs; each provides shikumi::TieredConfig with reasonable prescribed_default()s so 90% of operators get a working substrate from cargo run."

[dependencies]
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
thiserror          = { workspace = true }
shikumi            = "0.1.0"
# The `discovered()` tier is wired through shikumi's `DiscoveryLayer` seam,
# whose `discover()` returns a `figment::value::Dict`; the operator-file
# overlay in the progressive fold parses YAML into a `Dict` via figment's
# Yaml provider. Same figment (0.10) shikumi already pins — one closure.
figment            = { version = "0.10", features = ["yaml"] }
# Per-node deterministic cluster identity (see cluster.rs). `blake3` is
# the fleet's standard content hash; `gethostname` is a single-function
# crate rather than a subprocess, per the NO SHELL law.
blake3             = { workspace = true }
gethostname        = "1"

[dev-dependencies]
tempfile = "3"
