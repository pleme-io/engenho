description = "engenho-scheduler — the first real K8s controller on the engenho substrate. Reconciles pending Pods (no spec.nodeName) by picking a Node via a pluggable SchedulingStrategy trait + patching the Pod through StoreMesh. R8 of the engenho K8s base layer."

