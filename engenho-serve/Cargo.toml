[package]
name = "engenho-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
description = "engenho-serve — HTTP serving whose connection tasks the server OWNS: every accepted connection runs in a JoinSet the serve loop holds, so a stop drains them for a bounded grace and then aborts and awaits the rest. Shared by the Kubernetes apiserver and the control plane's local and remote listeners."

[lints]
workspace = true

[dependencies]
tokio              = { workspace = true }
tracing            = { workspace = true }
thiserror          = { workspace = true }
hyper              = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util         = { workspace = true, features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
# The trait axum's Router implements; `serve` accepts any such service.
tower-service      = "0.3"
rustls             = { workspace = true }
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
axum               = { workspace = true }
futures            = { workspace = true }
bytes              = "1"
http-body-util     = "0.1"
hyper              = { workspace = true, features = ["client", "http1"] }
tempfile           = "3"
