[package]
name = "engenho-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "MCP server exposing the engenho cluster operator surface — typed reader catalog (P0) and writer catalog (P2+)."

[[bin]]
name = "engenho-mcp"
path = "src/main.rs"

[dependencies]
# kotae — the typed answer vocabulary. This surface already classified its
# failures (`ReaderError::kind()`), which is more than most; what it could not
# express is the DIFFERENCE between them. A typo'd cluster name and an
# unreadable state file both rendered as `{"error": ...}`, so an agent could
# not tell "fix your argument" from "the tool cannot see".
kotae = "0.1"
anyhow             = { workspace = true }
async-trait        = { workspace = true }
engenho-cluster-config = { workspace = true }
engenho-types          = { workspace = true }
engenho-kube-client    = { workspace = true }
rmcp               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
