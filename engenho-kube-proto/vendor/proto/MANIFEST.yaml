# engenho-kube-proto — vendored Kubernetes protobuf (.proto) manifest (v1.34)
#
# Per theory/ENGENHO.md §VI.1 ("Determinism contract — generated source"),
# every byte the protobuf codec consumes is BLAKE3-attested — the same
# discipline as the vendored OpenAPI schemas in engenho-types. Any drift
# between this manifest and the on-disk file contents is caught by
# tests/vendored_proto_blake3.rs in CI.
#
# These are the go-to-protobuf-emitted .proto descriptors for the cataloged
# API groups (core/v1, apps/v1, rbac.authorization.k8s.io/v1) plus the shared
# apimachinery wrappers (runtime.Unknown framing, ObjectMeta, intstr,
# resource.Quantity, schema). The proto FIELD NAMES are already camelCase
# (e.g. `binaryData`) — go-to-protobuf strips the gogoproto jsontag and emits
# the JSON tag name verbatim — so the descriptor json_name (== K8s camelCase)
# drives the prost-reflect DynamicMessage <-> serde_json::Value bridge with no
# hand-maintained field map.
#
# Upstream source: https://github.com/kubernetes/kubernetes
# Branch:          release-1.34
# Path:            staging/src/<import-path>
#
# Update protocol:
#   1. Re-curl the .proto set under vendor/proto/<import-path>.
#   2. Recompute BLAKE3 (blake3::hash of the file bytes, to_hex).
#   3. Update this manifest.
#   4. `cargo test -p engenho-kube-proto` must pass (BLAKE3 + codec round-trip).
