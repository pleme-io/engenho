[package]
name = "engenho-csi"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme.workspace       = true
categories.workspace   = true
keywords.workspace     = true
description = "Container Storage Interface client for engenho. engenho implements the RUNTIME side of CSI — plugin registration, the node publish/stage path and the controller provision/attach path — so a vendor's unmodified CSI driver works against engenho the way it works against kubelet. The interface is the contract; what engenho does with the bytes underneath is engenho's business."

[lib]
path = "src/lib.rs"

[features]
# A real in-process CSI driver (a generated tonic server on a real unix
# socket) for tests — this crate's own and any downstream crate's. Off by
# default so it never ships in a production build.
test-driver = ["dep:tempfile", "tonic/router", "tonic/server"]

[dependencies]
prost        = "0.14"
prost-types  = "0.14"
tonic        = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost  = "0.14"
tokio        = { workspace = true }
tokio-stream = "0.1"
tower        = "0.5"
hyper-util   = "0.1"
http         = "1"
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
engenho-substrate = { path = "../engenho-substrate" }
tempfile     = { version = "3", optional = true }

[build-dependencies]
protox            = "0.9"
prost-build       = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio      = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic      = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "server"] }
tempfile   = "3"
engenho-csi = { path = ".", features = ["test-driver"] }

[lints]
workspace = true
