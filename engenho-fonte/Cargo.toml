[package]
name = "engenho-fonte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
description = "engenho-fonte — the live source-of-truth reconciler. shikumi-notify watches a (defsistema …) tlisp form; sui evaluates it; engenho-revoada Raft-proposes the new desired state; tameshi+sekiban attest the transition; engenho controllers reconcile; mirante publishes; orçamento budgets the change rate; provação chaos-tests the budgeted convergence. Five typed traits (Watcher, Evaluator, Proposer, Attester, Publisher) compose under a single Conduit. Mocks for every trait ship by default so consumers can wire end-to-end before any real subsystem is plugged in."

[features]
default = []
# Real revoada FabricFace-backed Proposer. Pulls in engenho-revoada
# (already in the workspace). Operator gets to compose: mock proposer
# for unit tests, real revoada proposer for integration/cluster runs.
with-revoada = ["dep:engenho-revoada"]
# Real shikumi-notify-backed Watcher. Pulls in pleme-io/shikumi via
# a cross-workspace path dep. Default off — file-watch consumers
# enable explicitly.
with-shikumi = ["dep:shikumi", "dep:notify"]
# Real sui_eval-backed Evaluator. Pulls in engenho-sui-typescape's
# with-sui-eval feature (which pulls in sui-eval cross-workspace).
with-sui-eval = ["engenho-sui-typescape/with-sui-eval"]
# Real KubeClient apply for KubeAppReconciler. Pulls in
# engenho-kube-client (already workspace dep). Default off — the
# dry-run shape stays the always-on default.
with-engenho-kube-client = ["dep:engenho-kube-client"]
# Real Attester backed by tameshi's HeartbeatChain. Cross-workspace
# path dep to pleme-io/tameshi. Off by default; integration sites
# enable when they need cryptographic chain attestation.
with-tameshi = ["dep:tameshi"]
# Real PromessaReconciler bridging fonte's PromessaRef to
# promessa-types' TargetController + PromessaTargetKind enum.
# Cross-workspace path dep to pleme-io/promessa.
with-promessa = ["dep:promessa-types"]
# tatara-lisp authoring surface — register Sistema as a typed
# (defsistema …) keyword. Pulls the canonical crates.io
# `tatara-lisp` (pleme-io/tatara-lisp).
with-tatara-lisp = ["dep:tatara-lisp"]
# caixa renderer integration — CaixaAppReconciler wraps
# caixa-helm's chart renderer. Cross-workspace path deps to
# pleme-io/caixa.
with-caixa = ["dep:caixa-core", "dep:caixa-helm", "dep:serde_yaml", "dep:tempfile"]
# shigoto DAG integration — ShigotoProvisioningController uses
# shigoto-dag for typed topological ordering + parallel waves.
with-shigoto = ["dep:shigoto-dag", "dep:shigoto-types", "dep:shigoto-retry", "dep:shigoto-budget"]

[dependencies]
async-trait            = { workspace = true }
futures                = { workspace = true }
# `rc` feature: needed because Change / Decision / Outcome carry
# Arc<str> for the source path + receipt id (Send+Sync), and serde
# round-trips them.
serde                  = { version = "1.0", features = ["derive", "rc"] }
serde_json             = { workspace = true }
thiserror              = { workspace = true }
tokio                  = { workspace = true, features = ["sync", "macros", "rt", "time"] }
blake3                 = "1"
engenho-substrate      = { workspace = true }
engenho-sui-typescape  = { workspace = true }
# Typed K8s catalog — used by KubeAppReconciler to translate an
# AppRef into a typed Deployment.
engenho-types          = { workspace = true }
# Optional — enabled by `with-engenho-kube-client`. Real K8s apply
# for KubeAppReconciler.
engenho-kube-client    = { workspace = true, optional = true }
# Optional — enabled by `with-tameshi`. Cross-workspace path dep
# to pleme-io/tameshi for cryptographic chain attestation.
tameshi                = { git = "https://github.com/pleme-io/tameshi", optional = true }
# Optional — enabled by `with-promessa`. Cross-workspace path dep
# to pleme-io/promessa for typed promise reconciliation.
promessa-types         = { git = "https://github.com/pleme-io/promessa", optional = true }
# Optional — enabled by `with-tatara-lisp`. The canonical published
# Lisp crate (pleme-io/tatara-lisp) for the `(defsistema …)` keyword.
tatara-lisp            = { version = "0.3.3", optional = true }
# Optional — enabled by `with-caixa`. Cross-workspace path deps
# to pleme-io/caixa for typed Servico chart rendering.
caixa-core             = { git = "https://github.com/pleme-io/caixa", optional = true }
caixa-helm             = { git = "https://github.com/pleme-io/caixa", optional = true }
serde_yaml             = { workspace = true, optional = true }
# Optional — enabled by `with-caixa` for the helm installer's
# tempdir scratch space.
tempfile               = { version = "3", optional = true }
shigoto-dag            = { git = "https://github.com/pleme-io/shigoto", optional = true }
shigoto-types          = { git = "https://github.com/pleme-io/shigoto", optional = true }
shigoto-retry          = { git = "https://github.com/pleme-io/shigoto", optional = true }
shigoto-budget         = { git = "https://github.com/pleme-io/shigoto", optional = true }
# Optional — enabled by `with-revoada`.
engenho-revoada        = { workspace = true, optional = true }
# Optional — enabled by `with-shikumi`. Cross-workspace path dep
# (shikumi is the cross-fleet config primitive; not in this workspace).
shikumi                = { git = "https://github.com/pleme-io/shikumi", optional = true }
# Optional — re-exported by `shikumi`'s ConfigWatcher callback shape.
# Pulled at the same feature flag so the dep set matches shikumi.
notify                 = { version = "8.2", optional = true }

[dev-dependencies]
tokio                  = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
proptest               = "1"
engenho-substrate-props = { workspace = true }
tempfile               = "3"
