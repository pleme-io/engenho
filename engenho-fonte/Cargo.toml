[package]
name = "engenho-fonte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
description = "engenho-fonte — the live source-of-truth reconciler. shikumi-notify watches a (defsistema …) tlisp form; sui evaluates it; engenho-revoada Raft-proposes the new desired state; tameshi+sekiban attest the transition; engenho controllers reconcile; mirante publishes; orçamento budgets the change rate; provação chaos-tests the budgeted convergence. Five typed traits (Watcher, Evaluator, Proposer, Attester, Publisher) compose under a single Conduit. Mocks for every trait ship by default so consumers can wire end-to-end before any real subsystem is plugged in."

[features]
default = []
# Real revoada FabricFace-backed Proposer. Pulls in engenho-revoada
# (already in the workspace). Operator gets to compose: mock proposer
# for unit tests, real revoada proposer for integration/cluster runs.
with-revoada = ["dep:engenho-revoada"]
# Real shikumi-notify-backed Watcher. Pulls in pleme-io/shikumi via
# a cross-workspace path dep. Default off — file-watch consumers
# enable explicitly.
with-shikumi = ["dep:shikumi", "dep:notify"]
# Real sui_eval-backed Evaluator. Pulls in engenho-sui-typescape's
# with-sui-eval feature (which pulls in sui-eval cross-workspace).
with-sui-eval = ["engenho-sui-typescape/with-sui-eval"]
# Real KubeClient apply for KubeAppReconciler. Pulls in
# engenho-kube-client (already workspace dep). Default off — the
# dry-run shape stays the always-on default.
with-engenho-kube-client = ["dep:engenho-kube-client"]

[dependencies]
async-trait            = { workspace = true }
futures                = { workspace = true }
# `rc` feature: needed because Change / Decision / Outcome carry
# Arc<str> for the source path + receipt id (Send+Sync), and serde
# round-trips them.
serde                  = { version = "1.0", features = ["derive", "rc"] }
serde_json             = { workspace = true }
thiserror              = { workspace = true }
tokio                  = { workspace = true, features = ["sync", "macros", "rt", "time"] }
blake3                 = "1"
engenho-substrate      = { workspace = true }
engenho-sui-typescape  = { workspace = true }
# Typed K8s catalog — used by KubeAppReconciler to translate an
# AppRef into a typed Deployment.
engenho-types          = { workspace = true }
# Optional — enabled by `with-engenho-kube-client`. Real K8s apply
# for KubeAppReconciler.
engenho-kube-client    = { workspace = true, optional = true }
# Optional — enabled by `with-revoada`.
engenho-revoada        = { workspace = true, optional = true }
# Optional — enabled by `with-shikumi`. Cross-workspace path dep
# (shikumi is the cross-fleet config primitive; not in this workspace).
shikumi                = { path = "../../shikumi", optional = true }
# Optional — re-exported by `shikumi`'s ConfigWatcher callback shape.
# Pulled at the same feature flag so the dep set matches shikumi.
notify                 = { version = "8.2", optional = true }

[dev-dependencies]
tokio                  = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
proptest               = "1"
engenho-substrate-props = { workspace = true }
tempfile               = "3"
