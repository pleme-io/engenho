[package]
name = "engenho-control-client"
description = "engenho-control-client — talks to a running engenho's control API (spec/engenho-control.openapi.yaml) over its local socket: typed calls per operation, a generic call for the table-driven CLI, and the socket resolution the daemon and `engenho ctl` share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
engenho-control-types = { workspace = true, features = ["tls"] }
engenho-config        = { workspace = true }
bytes                 = "1"
nix                   = { version = "0.29", default-features = false, features = ["user"] }
reqwest               = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
serde_yaml            = { workspace = true }
thiserror             = { workspace = true }

[dev-dependencies]
tempfile              = "3"
tokio                 = { workspace = true }
