[package]
name = "engenho-apiserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "engenho-apiserver — HTTP K8s API wrapping engenho-store. Translates kubectl REST operations into typed ResourceCommand proposals via the distributed substrate. Layer R7 of the engenho K8s base layer."

[dependencies]
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }
axum               = { workspace = true }
axum-server        = { workspace = true }
tower              = { workspace = true }
utoipa             = { workspace = true }
futures            = { workspace = true }
arc-swap           = { workspace = true }
bytes              = "1"
base64             = "0.22"
rcgen              = { workspace = true }
rustls             = { workspace = true }
rustls-pemfile     = { workspace = true }
# Same line axum-server 0.7 pulls; we wrap its RustlsAcceptor (which yields a
# tokio_rustls::server::TlsStream) to read the verified peer cert post-handshake.
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring"] }
time               = { workspace = true }

engenho-types      = { workspace = true }
engenho-store      = { workspace = true }
engenho-controllers = { workspace = true }
engenho-kube-proto = { workspace = true }
# ErrorKind trait + impl_error_kind! macro — stable .kind() tags.
engenho-substrate  = { workspace = true }

[dev-dependencies]
proptest = "1"
engenho-kube-proto = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde_urlencoded = "0.7"
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
