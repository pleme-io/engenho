[package]
name = "engenho-apiserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "engenho-apiserver — HTTP K8s API wrapping engenho-store. Translates kubectl REST operations into typed ResourceCommand proposals via the distributed substrate. Layer R7 of the engenho K8s base layer."

[dependencies]
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }
axum               = { workspace = true }
tower              = { workspace = true }
utoipa             = { workspace = true }
futures            = { workspace = true }
arc-swap           = { workspace = true }
bytes              = "1"
base64             = "0.22"
# The path decoder axum's `Path` extractor uses; RequestInfo decodes with the
# same function so authz and dispatch cannot disagree on a path.
percent-encoding   = "2"
rcgen              = { workspace = true }
# The CA fingerprint the control plane reports (pki_inventory). Already in
# the graph; same major.
sha2               = "0.10"
rustls             = { workspace = true }
rustls-pemfile     = { workspace = true }
# Deterministic cluster PKI — BLAKE3-derived per-role seeds → ed25519 keys.
blake3             = { workspace = true }
ed25519-dalek      = { workspace = true }
# ServiceAccount signing key. Randomness, NOT the PKI's deterministic
# derivation: unlike the CA (whose determinism buys a byte-identical
# kubeconfig), this key mints WORKLOAD identities, so deriving it from a
# public constant would let anyone holding the source mint a token for any
# ServiceAccount — including one bound to cluster-admin.
getrandom          = "0.2"
# engenho-serve's TLS handshake yields a tokio_rustls::server::TlsStream; the
# verified peer cert is read off it post-handshake (server/tls_acceptor.rs).
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring"] }
# The serve loop that owns every connection task (so a stop severs and awaits
# open watches instead of leaking them with the store they hold).
engenho-serve      = { workspace = true }
time               = { workspace = true }
# Production WebhookCaller — POST the AdmissionReview to a mutating webhook over
# HTTPS. The trait seam keeps engenho-controllers reqwest-free; the live impl
# lives here next to the rest of the apiserver's HTTP surface.
reqwest            = { workspace = true, features = ["json", "rustls-tls"] }

engenho-types      = { workspace = true }
engenho-store      = { workspace = true }
engenho-controllers = { workspace = true }
engenho-kube-proto = { workspace = true }
# The protobuf transcoder (src/proto_transcode.rs) walks the descriptors
# engenho-kube-proto compiles, at the versions that crate already pins, and
# renders metav1.Time/MicroTime through engenho-types' chrono surface.
prost              = "0.14"
prost-reflect      = "0.16"
chrono             = "0.4"
# ErrorKind trait + impl_error_kind! macro — stable .kind() tags.
engenho-substrate  = { workspace = true }

[dev-dependencies]
proptest = "1"
engenho-oracle = { path = "../engenho-oracle" }
engenho-kube-proto = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
serde_urlencoded = "0.7"
tempfile = "3"
# Tests build a one-off FOREIGN CA (the cluster CA is deterministic now, so a
# second load_or_generate_ca mints the same one — the untrusted-CA negative
# needs a genuinely different root).
rcgen = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# The control plane's certificates, to prove the apiserver refuses them.
engenho-control-types = { workspace = true, features = ["tls"] }
