apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: engenho
spec:
  interval: 5m
  chart:
    spec:
      chart: nats
      version: "1.2.x"
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: engenho
  values:
    config:
      cluster:
        enabled: true
        replicas: 3
      jetstream:
        enabled: true
        fileStore:
          enabled: true
          pvc:
            enabled: true
            size: 20Gi
      # Enable + populate leafnodes.remotes to join a global mesh.
      leafnodes:
        enabled: false
    container:
      env:
        GOMEMLIMIT: 4GiB
    service:
      enabled: true
      ports:
        nats: { enabled: true }
        leafnodes: { enabled: true }
        gateways: { enabled: false }
        monitor: { enabled: true }
