# engenho (main binary crate) — TYPED EMISSION enforced.
#
# This crate is format!()-clean across all targets (lib + bins + tests),
# so it opts INTO the with-format-ban gate. clippy resolves the nearest
# `clippy.toml` walking up from this crate's manifest; this file (a
# crate-local config) REPLACES the non-banning workspace-root
# ../clippy.toml for this crate only. See ../clippy.toml for the
# scoping rationale and the list of crates still being migrated.
#
# Canonical: https://github.com/pleme-io/theory/blob/main/TYPED-EMISSION.md
disallowed-macros = [
  { path = "std::format", reason = "TYPED EMISSION: emit through typed serde / Display write!() / serde_yaml / the codec, not format!() of wire" },
]
