[package]
name = "engenho"
description = "Typed, attested, Rust-native Kubernetes runtime. The engine that runs the land (terreno). Pillar 7 runtime half; sibling to magma. Spec: theory/ENGENHO.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[[bin]]
name = "engenho"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
engenho-types       = { workspace = true }
engenho-config      = { workspace = true }
engenho-runtime     = { workspace = true }
engenho-apiserver   = { workspace = true }
engenho-kube-client = { workspace = true }
# `engenho unit-run`: the systemd-unit runner (parser, identity, directories,
# credentials, privilege drop).
engenho-unit        = { workspace = true }
# The control plane: the socket the daemon serves, the client `engenho ctl`
# is, and the spec both speak.
engenho-control-types  = { workspace = true }
engenho-control-server = { workspace = true }
engenho-control-client = { workspace = true }
engenho-serve          = { workspace = true }

anyhow             = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The stop-signal suite (tests/t2_9_stop_signal.rs) boots the BUILT binary and
# signals it. `nix` is already in the graph (0.29); `signal` is the one safe
# `kill(2)` wrapper, so the test needs no `unsafe` of its own.
nix        = { version = "0.29", default-features = false, features = ["signal", "user"] }
serde_json = { workspace = true }
tempfile   = "3"
