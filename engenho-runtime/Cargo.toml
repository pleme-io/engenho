[package]
name = "engenho-runtime"
description = "engenho-runtime — the single-node assembly layer. Boots StoreMesh + ApiServer + controllers + scheduler + kubelet over ONE durable store in ONE process, so a POSTed apps/v1 Deployment converges to a running container. The engenho binary is a thin launcher over Runtime::start. Spec: theory/ENGENHO.md §IX; M0.1 item 7."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = []
# Real secure file permissions via cofre-fs (open(2) with mode, no
# chmod-after-write race). Off by default; integration sites enable
# when they need the full cofre security guarantee. The fallback
# uses std::fs + chmod, which has a brief window at default perms.
with-cofre = ["dep:cofre-fs"]

[dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server", "codegen", "transport"] }
engenho-cni   = { path = "../engenho-cni" }
engenho-etcd  = { path = "../engenho-etcd" }
engenho-config      = { workspace = true }
# Typed RBAC kinds (rbac_v1) — the bootstrap seeds are built as typed
# ClusterRole/ClusterRoleBinding values, then serialized + Put into the store.
engenho-types       = { workspace = true }
engenho-store       = { workspace = true }
engenho-apiserver   = { workspace = true }
# The ServiceAccount signing key's type, for RuntimeSaProjector — this layer
# is the only one holding both the apiserver's key and the kubelet.
ed25519-dalek       = { workspace = true }
engenho-controllers = { workspace = true }
engenho-scheduler   = { workspace = true }
axum               = { workspace = true }
engenho-kubelet     = { workspace = true }
engenho-kube-client = { workspace = true }
# ErrorKind trait + impl_error_kind! macro — stable .kind() tags.
engenho-substrate   = { workspace = true }

serde               = { workspace = true }
serde_json          = { workspace = true }
# The lenient `runtime.data_dir` read the supervisor falls back on when the
# declared config does not resolve (lifecycle/bootstrap.rs).
serde_yaml          = { workspace = true }
# Timestamp arithmetic for the lifecycle (a failed boot's next retry). Already
# in the graph through engenho-types, same features.
chrono              = { version = "0.4", features = ["serde"] }
# The declared config file's digest (drift since a boot read it).
blake3              = { workspace = true }
# Health's child rows, swapped whole when a child is respawned.
arc-swap            = { workspace = true }
# The control plane: the spec's types and trait this crate implements
# (control/), the audit chain `listAudit` pages, and the remote listener's
# pins `getControl` reports.
engenho-control-types  = { workspace = true, features = ["tls"] }
engenho-control-server = { workspace = true }
# The log ring the control plane serves is a tracing layer.
tracing-subscriber  = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true }
tracing             = { workspace = true }
# The supervisor watches the declared config file (symlink-aware, so a Nix
# rebuild that swaps the store path is seen) to retry a boot held on it.
shikumi             = "0.1.0"
# The stop pair a supervised boot is cancelled through (and the serve loop the
# control listeners run on).
engenho-serve       = { workspace = true }
# The KubeletLogReader adapter implements the apiserver's async PodLogReader trait.
async-trait         = { workspace = true }
# The node-manifests driver drives the apiserver's own router in-process
# (`ServiceExt::oneshot`) — the path `kubectl apply --server-side` reaches.
tower               = { workspace = true, features = ["util"] }
# OS entropy for the bootstrap admin bearer token (no plaintext secret in the
# tree; the token is minted + persisted 0600 at first boot).
getrandom           = "0.3"
# Credential files created AT their final mode by open(2) rather than
# chmod'ed afterwards: the kubeconfig (embeds client-key-data), admin.key,
# admin.token. Dependency-free; `#![cfg(unix)]`, so the non-unix arms of
# write_at_mode / create_pki_dir don't reference it.
# Optional — enabled by `with-cofre`. Secure file creation via open(2)
# with mode (no chmod-after-write race). Cross-workspace git dep to
# pleme-io/cofre.
cofre-fs            = { version = "0.1.0", optional = true }

[dev-dependencies]
engenho-etcd = { path = "../engenho-etcd" }
# tests/clean_stop_restart.rs reads a stopped node's durable image raw
# (applied position vs the log's last entry) through the store's openraft
# storage traits. Already in the graph via engenho-store; same pinned version.
openraft = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
# The lifecycle machine's store invariant, over arbitrary event sequences.
proptest = { workspace = true }
# `tokio::time::pause`: the listener rebind tests walk minutes of backoff in
# virtual time. A feature of the tokio already in the graph, not a new crate.
tokio = { workspace = true, features = ["test-util"] }
