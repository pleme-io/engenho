[package]
name = "engenho-runtime"
description = "engenho-runtime — the single-node assembly layer. Boots StoreMesh + ApiServer + controllers + scheduler + kubelet over ONE durable store in ONE process, so a POSTed apps/v1 Deployment converges to a running container. The engenho binary is a thin launcher over Runtime::start. Spec: theory/ENGENHO.md §IX; M0.1 item 7."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = []
# Real secure file permissions via cofre-fs (open(2) with mode, no
# chmod-after-write race). Off by default; integration sites enable
# when they need the full cofre security guarantee. The fallback
# uses std::fs + chmod, which has a brief window at default perms.
with-cofre = ["dep:cofre-fs"]

[dependencies]
engenho-config      = { workspace = true }
# Typed RBAC kinds (rbac_v1) — the bootstrap seeds are built as typed
# ClusterRole/ClusterRoleBinding values, then serialized + Put into the store.
engenho-types       = { workspace = true }
engenho-store       = { workspace = true }
engenho-apiserver   = { workspace = true }
engenho-controllers = { workspace = true }
engenho-scheduler   = { workspace = true }
axum               = { workspace = true }
engenho-kubelet     = { workspace = true }
engenho-kube-client = { workspace = true }
# ErrorKind trait + impl_error_kind! macro — stable .kind() tags.
engenho-substrate   = { workspace = true }

serde_json          = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true }
tracing             = { workspace = true }
# The KubeletLogReader adapter implements the apiserver's async PodLogReader trait.
async-trait         = { workspace = true }
# OS entropy for the bootstrap admin bearer token (no plaintext secret in the
# tree; the token is minted + persisted 0600 at first boot).
getrandom           = "0.3"
# Credential files created AT their final mode by open(2) rather than
# chmod'ed afterwards: the kubeconfig (embeds client-key-data), admin.key,
# admin.token. Dependency-free; `#![cfg(unix)]`, so the non-unix arms of
# write_at_mode / create_pki_dir don't reference it.
# Optional — enabled by `with-cofre`. Secure file creation via open(2)
# with mode (no chmod-after-write race). Cross-workspace git dep to
# pleme-io/cofre.
cofre-fs            = { version = "0.1.0", optional = true }

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
shikumi = "0.1.0"
tempfile = "3"
tokio = { workspace = true }
