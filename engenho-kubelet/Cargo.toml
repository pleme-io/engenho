[package]
name = "engenho-kubelet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "engenho-kubelet — the missing piece between 'Pod object in the store' and 'container running on host'. Per-node controller that watches Pods bound to its node + materializes containers via a pluggable ContainerRuntime backend (PodmanBackend / CriBackend / RunwasiBackend / FakeBackend for tests)."

[dependencies]
engenho-csi   = { path = "../engenho-csi" }
tonic         = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost   = "0.14"
prost         = "0.14"
axum   = { workspace = true, features = ["ws"] }
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }
reqwest            = { workspace = true }
# Secret volume values are base64-encoded per K8s; decode them before
# writing the materialized files. Same 0.22 line the apiserver + kube-client
# already pin (single closure).
base64             = "0.22"

engenho-types       = { workspace = true }
engenho-store       = { workspace = true }
engenho-controllers = { workspace = true }
engenho-config      = { workspace = true }
engenho-substrate   = { workspace = true }

[build-dependencies]
protox            = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
engenho-csi = { path = "../engenho-csi", features = ["test-driver"] }
tower = { workspace = true, features = ["util"] }
proptest = "1"
# A REAL client for the one test that opens an actual socket. The pure
# pump tests cannot see a wiring bug — a handler that never upgrades, a
# subprotocol never echoed back, a frame sent as text instead of binary —
# and every one of those presents to a user as a hang, not an error.
# Both are already in the lock as axum's own ws dependencies, so this
# costs no new third-party code.
tokio-tungstenite = "0.24"
futures-util = "0.3"
