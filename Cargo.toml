[workspace]
resolver = "2"
members = [
  "engenho",
  "engenho-types",
  "engenho-cluster-config",
  "engenho-cluster-config-render",
  "engenho-kube-client",
  "engenho-kube-codegen",
  "engenho-mcp",
  "engenho-revoada",
  "engenho-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/engenho"
authors = ["pleme-io"]

[workspace.dependencies]
engenho-types          = { path = "engenho-types" }
engenho-cluster-config = { path = "engenho-cluster-config" }
engenho-kube-client    = { path = "engenho-kube-client" }
engenho-store          = { path = "engenho-store" }
serde                  = { version = "1.0", features = ["derive"] }
serde_yaml             = "0.9"
serde_json             = "1.0"
thiserror              = "2.0"
indoc                  = "2.0"
anyhow                 = "1.0"
async-trait            = "0.1"
tokio                  = { version = "1", features = ["full"] }
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter"] }
rmcp                   = { version = "0.15", features = ["server", "transport-io", "macros"] }

# Distribution-layer deps (used by engenho-revoada). Pinned to the
# same versions tatara-engine ships in production so we stay in sync.
chitchat               = "0.10"
openraft               = { version = "0.9", features = ["serde", "storage-v2"] }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
