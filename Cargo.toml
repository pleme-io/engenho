[workspace]
resolver = "2"
members = [
  "engenho",
  "engenho-types",
  "engenho-cluster-config",
  "engenho-cluster-config-render",
  "engenho-kube-client",
  "engenho-kube-codegen",
  "engenho-kube-proto",
  "engenho-mcp",
  "engenho-revoada",
  "engenho-store",
  "engenho-apiserver",
  "engenho-teia",
  "engenho-scheduler",
  "engenho-controllers",
  "engenho-config",
  "engenho-kubelet",
  "engenho-runtime",
  "engenho-substrate",
  "engenho-substrate-props",
  "engenho-sui-typescape",
  "engenho-fonte",
  "engenho-fonte-cli",
  "engenho-diff",
  "engenho-cni",
  "engenho-csi",
  "engenho-etcd",
]

[workspace.package]
version = "0.53.118"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/engenho"
homepage = "https://github.com/pleme-io/engenho"
readme = "README.md"
authors = ["pleme-io"]
# Inherited via `.workspace = true` in each crate. Per-crate
# Cargo.toml can override `keywords` with crate-specific terms.
categories = ["api-bindings", "network-programming"]
keywords = ["kubernetes", "engenho", "pleme-io"]

[workspace.dependencies]
# Internal workspace deps. The `version` field is required for
# crates.io publish — when publishing, cargo strips the `path`
# entry and resolves the dep against the registry. Operators
# building locally always use `path`; downstream crates pulling
# us from crates.io use `version`.
engenho-types          = { path = "engenho-types", version = "0.53.118" }
engenho-cluster-config = { path = "engenho-cluster-config", version = "0.53.118" }
engenho-kube-client    = { path = "engenho-kube-client", version = "0.53.118" }
engenho-kube-proto     = { path = "engenho-kube-proto", version = "0.53.118" }
engenho-store          = { path = "engenho-store", version = "0.53.118" }
engenho-apiserver      = { path = "engenho-apiserver", version = "0.53.118" }
engenho-runtime        = { path = "engenho-runtime", version = "0.53.118" }
engenho-scheduler      = { path = "engenho-scheduler", version = "0.53.118" }
engenho-controllers    = { path = "engenho-controllers", version = "0.53.118" }
engenho-config         = { path = "engenho-config", version = "0.53.118" }
engenho-kubelet        = { path = "engenho-kubelet", version = "0.53.118" }
engenho-teia           = { path = "engenho-teia", version = "0.53.118" }
engenho-substrate      = { path = "engenho-substrate", version = "0.53.118" }
engenho-substrate-props = { path = "engenho-substrate-props", version = "0.53.118" }
engenho-sui-typescape  = { path = "engenho-sui-typescape", version = "0.53.118" }
engenho-fonte          = { path = "engenho-fonte", version = "0.53.118" }
engenho-revoada        = { path = "engenho-revoada", version = "0.53.118" }

# Pleme-io sibling-directory path deps for typed-dispatcher
# catalog integration (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = "0.1"
gen-types = "0.1"

# Convergence primitive — engenho-types' KubeError::classify consumes the
# canonical Transient/Declarative split (theory/CONVERGENCE-ADOPTION.md;
# theory/FAILURE-CLASSIFICATION.md) instead of hand-rolling FailureClass.
shigoto-types = "0.1"

axum                   = "0.7"
# Lock-free runtime-mutable handler table for the apiserver dispatch map.
# ArcSwap::load() is a cheap atomic load on the hot read path (every
# request's lookup); register/unregister is a rare clone-insert-swap via
# rcu (read-copy-update, lost-write-safe under racing CrdController ticks).
arc-swap               = "1"
hyper                  = { version = "1", features = ["client", "http1"] }
hyper-util             = { version = "0.1", features = ["tokio"] }
http-body-util         = "0.1"
tower                  = "0.5"
reqwest                = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
utoipa                 = { version = "5", features = ["axum_extras"] }
async-nats             = "0.38"
futures                = "0.3"
serde                  = { version = "1.0", features = ["derive"] }
serde_yaml             = "0.9"
serde_json             = "1.0"
thiserror              = "2.0"
indoc                  = "2.0"
anyhow                 = "1.0"
async-trait            = "0.1"
tokio                  = { version = "1", features = ["full"] }
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter"] }
proptest               = "1"
rmcp                   = { version = "0.15", features = ["server", "transport-io", "macros"] }

# Distribution-layer deps (used by engenho-revoada). Pinned to the
# same versions tatara-engine ships in production so we stay in sync.
chitchat               = "0.10"
# Pinned at =0.9.22 — 0.9.24 has a trait-inference conflict with newer
# rkyv's PartialEq impl (rustc E0283 in openraft/src/metrics/wait.rs:231).
openraft               = { version = "=0.9.22", features = ["serde", "storage-v2"] }

# Embedded LSM key-value store — the single durable backend for
# engenho-store's openraft RaftLogStorage + RaftStateMachine. One
# keyspace per store dir, one partition per concern (log / meta /
# catalog / snapshot). Crash-safe append via keyspace.persist(SyncAll).
fjall                  = "2"

# Apiserver TLS — self-generated, data_dir-persisted cluster CA + a
# per-boot server cert (rcgen), served over HTTPS via axum-server's
# rustls acceptor. rustls is pinned to the 0.23 line fleet-wide and the
# `ring` provider is installed explicitly at boot so a single crypto
# provider closure unifies with reqwest's rustls-tls (no aws-lc-rs/ring
# double-install panic). `tls-rustls-no-provider` keeps the provider
# choice in our hands (we install ring); rcgen needs x509-parser to
# reload a persisted CA from its PEM.
rcgen                  = { version = "0.13", features = ["pem", "x509-parser"] }
axum-server            = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls                 = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile         = "2"
time                   = "0.3"
# Deterministic cluster PKI: a BLAKE3-derived seed → an ed25519 key, so a
# fresh engenho produces a byte-identical CA / kubeconfig (no random keygen).
blake3                 = "1"
ed25519-dalek          = { version = "2", features = ["pkcs8", "pem"] }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# ── Cargo profiles: who reads them, and who never does (plan T0.9) ────────
#
# THE ENGENHO DAEMON NEVER READS THESE. The binary that runs on rio, ryn and
# plo is built by Nix: flake.nix -> substrate.rust.workspace ->
# lib/build/rust/lockfile-builder.nix, which compiles every crate with
# nixpkgs' buildRustCrate and `release = true`. buildRustCrate calls rustc
# directly, not cargo, so no [profile.*] section reaches it: it passes
# `-C opt-level=3` and no LTO (build-rust-crate/build-crate.nix:31), whatever
# is written below. Nothing here changes what runs in a cluster.
#
# Cargo does read them, for:
#   release  the engenho-mcp and engenho-cluster-config-render binaries in
#            every GitHub Release (release.yml -> substrate
#            rust-binary-release.yml -> pleme-io/actions/rust-cross-build,
#            `cargo build --release`), and any `cargo install`.
#   stress   deep-test.yml's property-stress job, 4,096 cases per property
#            (`cargo nextest run --cargo-profile stress`).
#   dev      every other local and CI test run (cargo's defaults).
#
# ci/cargo-profiles.tlisp checks both sections below on every push (its suite
# runs in test.yml's ci-contract-tests), and fails if a workflow env or a
# .cargo/config overrides either from outside this file.

[profile.release]
codegen-units = 1
lto = true
# 3, the level the Nix-built daemon is compiled at. It was "z" (size), which
# measured 1.7-1.9x slower on serde_json round trips, a cost only these two
# cargo-built binaries paid. This deviates from the fleet's "z" convention on
# purpose, for that measured cost.
opt-level = 3
strip = true

# Property tests at a raised case count. Optimised so 4,096 cases finish, and
# checking everything the default test run checks. The lane used to build
# with `--release`, which compiles out every `debug_assert!` (among them
# engenho-store's revision check in state.rs) and integer overflow checks, so
# it checked less per case than the 256-case run it was meant to deepen.
# Each property is declared here, not inherited, so a change to
# [profile.release] cannot quietly change what the stress lane checks.
[profile.stress]
inherits = "release"
opt-level = 3
debug-assertions = true
overflow-checks = true
# release's fat LTO and single codegen unit would be paid again for each of
# the ~160 test binaries; nothing above depends on either.
lto = false
codegen-units = 16
# The lane sets RUST_BACKTRACE=1. A stripped binary prints a backtrace with no
# function names, which is the one thing a failing stress case needs.
strip = false
debug = false
