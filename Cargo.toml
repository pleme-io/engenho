[workspace]
resolver = "2"
members = [
  "engenho",
  "engenho-types",
  "engenho-cluster-config",
  "engenho-cluster-config-render",
  "engenho-kube-client",
  "engenho-kube-codegen",
  "engenho-mcp",
  "engenho-revoada",
  "engenho-store",
  "engenho-apiserver",
  "engenho-teia",
  "engenho-scheduler",
  "engenho-controllers",
  "engenho-config",
  "engenho-kubelet",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/engenho"
homepage = "https://github.com/pleme-io/engenho"
readme = "README.md"
authors = ["pleme-io"]
# Inherited via `.workspace = true` in each crate. Per-crate
# Cargo.toml can override `keywords` with crate-specific terms.
categories = ["api-bindings", "network-programming"]
keywords = ["kubernetes", "engenho", "pleme-io"]

[workspace.dependencies]
# Internal workspace deps. The `version` field is required for
# crates.io publish — when publishing, cargo strips the `path`
# entry and resolves the dep against the registry. Operators
# building locally always use `path`; downstream crates pulling
# us from crates.io use `version`.
engenho-types          = { path = "engenho-types", version = "0.1.3" }
engenho-cluster-config = { path = "engenho-cluster-config", version = "0.1.3" }
engenho-kube-client    = { path = "engenho-kube-client", version = "0.1.3" }
engenho-store          = { path = "engenho-store", version = "0.1.3" }
engenho-scheduler      = { path = "engenho-scheduler", version = "0.1.3" }
engenho-controllers    = { path = "engenho-controllers", version = "0.1.3" }
engenho-config         = { path = "engenho-config", version = "0.1.3" }
engenho-kubelet        = { path = "engenho-kubelet", version = "0.1.3" }
engenho-teia           = { path = "engenho-teia", version = "0.1.3" }
axum                   = "0.7"
hyper                  = "1"
tower                  = "0.5"
reqwest                = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
utoipa                 = { version = "5", features = ["axum_extras"] }
async-nats             = "0.38"
futures                = "0.3"
serde                  = { version = "1.0", features = ["derive"] }
serde_yaml             = "0.9"
serde_json             = "1.0"
thiserror              = "2.0"
indoc                  = "2.0"
anyhow                 = "1.0"
async-trait            = "0.1"
tokio                  = { version = "1", features = ["full"] }
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter"] }
rmcp                   = { version = "0.15", features = ["server", "transport-io", "macros"] }

# Distribution-layer deps (used by engenho-revoada). Pinned to the
# same versions tatara-engine ships in production so we stay in sync.
chitchat               = "0.10"
openraft               = { version = "0.9", features = ["serde", "storage-v2"] }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
