# forge-gen manifest — engenho's control-plane API (spec/engenho-control.openapi.yaml).
#
# STATUS (P0b spike, 2026-09-22 — full report in docs/CONTROL-PLANE.md § Spike):
# the Rust server and SDK targets below FAILED the spike checklist, so the
# central Rust types are generated by typify in engenho-control-types/build.rs
# instead (spec-first, nothing committed, no JVM at build time). This manifest
# stays as the declared projection for the targets that do not ship code into
# the daemon — completions and docs — and as the record of what was tried.
#
#   pending-forge-gen: rust-typed target — a forge-gen target that emits
#   typify-grade Rust (closed tagged enums, pattern newtypes, NonZero*) so
#   engenho-control-types can fold back into this manifest.
#
# Run (outputs are NOT committed): nix shell nixpkgs#openapi-generator-cli \
#   --command forge-gen generate --manifest forge-gen.toml --output <scratch>

[spec]
path = "spec/engenho-control.openapi.yaml"

[output]
dir = "gen"

# ── Spike targets (failed the checklist; kept to re-run the measurement) ────
[servers]
targets = ["rust-axum"]

[sdks]
targets = ["rust"]
name = "engenho-control"

# ── Completions + docs (non-daemon projections) ─────────────────────────────
[completions]
targets = ["skim-tab", "fish"]
name = "engenho"
icon = "E"
grouping = "tag"

[docs]
targets = ["markdown"]
