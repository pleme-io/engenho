[package]
name = "engenho-kube-codegen"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme.workspace       = true
categories.workspace   = true
keywords.workspace     = true
description = "OpenAPI v3 → typed Rust source generator for engenho-types. Reads BLAKE3-attested vendored K8s schemas + emits one Rust struct per kind with `impl KubeResource`. Per theory/ENGENHO.md §IV — generation over composition (Pillar 12)."

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
anyhow      = "1.0"
clap        = { version = "4.5", features = ["derive"] }
# Pure-Rust formatting of the emitted source. Deliberately NOT a `rustfmt`
# subprocess: the output must be byte-identical on every machine for the
# --check determinism contract to mean anything, and a subprocess would make
# it depend on whichever rustfmt happens to be on PATH.
prettyplease = "0.2"
syn          = { version = "2.0", features = ["full", "parsing"] }

[[bin]]
name = "engenho-kube-codegen"
path = "src/bin/codegen.rs"

[lints]
workspace = true
