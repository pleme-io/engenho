[package]
name = "engenho-types"
description = "Typed Kubernetes resource catalog for engenho. Generated from upstream OpenAPI v3 via forge-gen (Pillar 12 — generation over composition). One #[derive(KubeResource, TataraDomain)] per kind; no hand-authored types per the engenho prime directive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars   = { version = "0.8", features = ["chrono"] }
chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "2"

[dev-dependencies]
insta    = { version = "1", features = ["json"] }
proptest = "1"

[features]
default        = []
# Round-trip a vendored OpenAPI v3 schema against the typed surface.
# CI gate; not part of the runtime binary.
openapi-roundtrip = []
# Byte-reproducibility verification — regenerate and diff against tree source.
bit-repro      = []
