[package]
name = "engenho-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "engenho's K8s resource store — etcd-equivalent backed by openraft. Separate Raft group from engenho-revoada (which commits role assignments); this commits K8s resource CRUD. Layer of the Pillar 7 runtime that engenho-apiserver wraps to serve the K8s API surface."

[dependencies]
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }

engenho-types      = { workspace = true }
engenho-teia       = { workspace = true }
engenho-substrate  = { workspace = true }
futures            = { workspace = true }
openraft           = { workspace = true }
fjall              = { workspace = true }
blake3             = "1"

[target.'cfg(unix)'.dependencies]
# flock(2) for the data-dir lock. Unix-only on purpose: the lock is a real
# guarantee there, and `data_dir_lock` refuses rather than fakes it elsewhere.
libc               = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
