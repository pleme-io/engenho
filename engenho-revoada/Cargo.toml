[package]
name = "engenho-revoada"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "engenho's distribution layer — dynamic K8s control-plane / worker role shifting via Raft consensus + gossip membership + P2P content sync + BLAKE3 attested transitions. Read docs/DISTRIBUTED.md."

[dependencies]
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }

# Engenho-types: shared Quantity primitive (used in NodeCapacity).
engenho-types      = { workspace = true }

# Layer A — chitchat gossip + phi-accrual failure detector.
chitchat           = { workspace = true }

# Layer B — openraft Raft consensus.
openraft           = { workspace = true }

# Layer C (content-addressed P2P) — iroh.
# Pinned at R5.
# iroh = { version = "0.x", optional = true }

# Layer D — real BLAKE3 + ed25519 attestation chain (R4).
blake3             = "1"
ed25519-dalek      = { version = "2", features = ["rand_core", "serde"] }
rand               = "0.8"

# Face-level resource verbs: NativeEnvelope CBOR for PureRaftFace's
# apply/get/list/delete byte protocol. Other faces use their own
# native format (yaml/json/hcl via serde_yaml / serde_json already
# in workspace).
ciborium           = "0.2"

[dev-dependencies]
proptest = "1"
serde_yaml = { workspace = true }
