# VictoriaLogs — single-node log store. Reachable pod-to-pod as
# `victoria-logs:9428`. Vector ships logs here via its HTTP jsonline endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: observability
  labels: { app: victoria-logs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: victoria-logs }
  template:
    metadata:
      labels: { app: victoria-logs }
    spec:
      containers:
        - name: vlogs
          image: docker.io/victoriametrics/victoria-logs:latest
          args:
            - "--retentionPeriod=1d"
            - "--httpListenAddr=:9428"
          ports:
            - containerPort: 9428
          readinessProbe:
            httpGet: { path: /health, port: 9428 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: observability
  labels: { app: victoria-logs }
spec:
  selector: { app: victoria-logs }
  ports:
    - name: http
      port: 9428
      targetPort: 9428
