# VictoriaMetrics — single-node TSDB. The metrics store for the engenho
# standard observability layer (homelab variant: VictoriaMetrics + VictoriaLogs
# + Vector + Grafana). Reachable pod-to-pod as `victoria-metrics:8428` via the
# aardvark network-alias engenho assigns from the Service name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: observability
  labels: { app: victoria-metrics }
spec:
  replicas: 1
  selector:
    matchLabels: { app: victoria-metrics }
  template:
    metadata:
      labels: { app: victoria-metrics }
    spec:
      containers:
        - name: vm
          image: docker.io/victoriametrics/victoria-metrics:latest
          args:
            - "--retentionPeriod=1d"
            - "--httpListenAddr=:8428"
          ports:
            - containerPort: 8428
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: observability
  labels: { app: victoria-metrics }
spec:
  selector: { app: victoria-metrics }
  ports:
    - name: http
      port: 8428
      targetPort: 8428
