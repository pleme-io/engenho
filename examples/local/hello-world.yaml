apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: hello
  name: busybox
  labels: { app: busybox }
spec:
  replicas: 2
  selector:
    matchLabels: { app: busybox }
  template:
    metadata:
      labels: { app: busybox }
    spec:
      containers:
      - name: app
        image: busybox:latest
        imagePullPolicy: Never
        command: ["/bin/sh","-c","echo hello-from-engenho; sleep 3600"]
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  namespace: hello
  name: busybox
spec:
  selector: { app: busybox }
  ports: [{ port: 80, targetPort: 8080 }]
