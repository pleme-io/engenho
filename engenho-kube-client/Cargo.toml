[package]
name = "engenho-kube-client"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme.workspace       = true
categories.workspace   = true
keywords.workspace     = true
description = "Reqwest-backed implementation of engenho-types' KubeClient + Watcher traits. Speaks the upstream Kubernetes REST API over HTTPS with rustls + the four standard auth methods (anonymous, bearer token, client cert, exec plugin)."

[dependencies]
engenho-types     = { workspace = true }
# Substrate: Risca<T> wrapper for bearer tokens so accidental
# leakage via Debug/Display/Serialize is impossible at the type
# level (operator must call .expose_secret() at every exposure
# site).
engenho-substrate = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
serde_yaml    = { workspace = true }
thiserror     = { workspace = true }
async-trait   = "0.1"
async-stream  = "0.3"
futures-core  = "0.3"
futures-util  = "0.3"
bytes         = "1"
url           = "2"
tokio         = { version = "1", features = ["rt", "macros", "io-util"] }
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64        = "0.22"

[features]
# Exposes the in-memory `MockKubeClient` to downstream consumers (e.g.
# engenho-diff's differ unit tests). The module is already gated on
# `cfg(any(test, feature = "mock"))`; this declares the flag so external
# crates can opt in without pulling a live cluster.
mock = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "io-util"] }
proptest = "1"

[lints]
workspace = true
