name: crates-publish

# Tag-triggered (v*). Ships every workspace member to the Rust
# registry in topological order; auto-renames any name-conflicting
# crate to pleme-io-<original> + commits the rename back to main.
#
# Pure composition — no shell. All logic lives in
# pleme-io/actions/rust-workspace-publish (Rust + tatara-lisp).
#
# Requires repo secret CARGO_REGISTRY_TOKEN with publish scope.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run as --dry-run only (no upload)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - uses: pleme-io/actions/rust-workspace-publish@v1
        with:
          dry-run: ${{ inputs.dry-run || 'false' }}
          no-verify: "true"
          rename-prefix: "pleme-io-"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
