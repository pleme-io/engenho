name: test

# ─────────────────────────────────────────────────────────────────────────────
# THE REAL GATE. This is the workflow that actually COMPILES AND RUNS engenho.
#
# WHY IT EXISTS (read before "simplifying" it back into ci.yml).
#
# `ci.yml` runs two Nix steps: `gen confirm` (fatal; the Cargo.lock <->
# Cargo.gen.lock tie) and a non-fatal `nix flake check`. It stopped being a
# shim onto substrate's `cargo-ci.yml` in 4757f50; the argument below is
# unchanged. `nix flake check` builds only `checks.<system>.*`, and
# engenho's flake declares exactly one: `checks.<system>.typed-config` (since
# 51e702a), an eval-time test of the Nix module trio's typed options that
# stubs the trio's `settings` rather than building engenho. It compiles no
# Rust, so ci.yml proves the flake and its typed module surface evaluate and
# says nothing about the crates. On the sibling repo
# `forge` this was proven by probe: a clean tree exited 0, a `compile_error!`
# in a test module exited 0, and LITERAL NON-RUST GARBAGE in a function body
# ALSO exited 0 — every run printing "(build skipped)". The crate was never
# compiled, not merely untested.
#
# WHY NOT FIX IT AT THE LOAD-BEARING LAYER INSTEAD (Operating Principle #2).
# The right fix is for the flake to expose real `checks` so `nix flake check`
# compiles + tests hermetically. Until 2026-09-19 that was blocked in
# substrate: nixpkgs' `buildRustCrate` has no `runTests`, and
# `lockfile-builder.nix`, the engine `substrate.rust.workspace` routes to,
# had no test runner.
#
# THE FIX HAS LANDED UPSTREAM; ENGENHO HAS NOT ADOPTED IT (improvement plan
# T0.9). Substrate 83bab67 added an opt-in runner:
# `substrate.rust.workspace { tests.cargo.runs = [ … ]; }` yields
# `checks.<system>.tests`, `cargo test --frozen` over a vendor dir built from
# Cargo.lock, reading this repo's [profile.*] itself. engenho's flake.lock
# pins substrate fcd3514, which predates it. Pending: bump that input,
# declare `tests.cargo` in flake.nix, and check that the five private git
# dependencies vendor inside Nix. Until then THIS workflow is what stands
# between engenho and an un-compiled merge; afterwards its cargo steps can
# collapse into the flake. Building an in-repo `checks` by hand would be a
# SECOND, divergent Rust build path; Operating Principle #1 forbids that.
#
# ─────────────────────────────────────────────────────────────────────────────
# PRIVATE DEPENDENCIES AND WHAT IS STILL RED — measured on main in runs
# 35418242848 and 35421804575 (2026-09-19). Both used `cargo test`; the test
# leg below now runs nextest over the same tests.
#
# Cargo.lock has git dependencies on five pleme-io repos (tameshi · cofre ·
# promessa · sui · tatara), and cargo resolves the whole lock graph whatever
# the features, so every cargo command fetches them. `git-credentials` rewrites
# github.com URLs to carry BOT_PAT. In both runs BOT_PAT arrived non-empty (the
# step log prints `bot-pat: ***`) and every private dependency resolved: the
# engenho-diff compile leg was green and the test leg built and ran the whole
# workspace.
#
# Why it arrives: engenho is PUBLIC (`gh repo view` -> PUBLIC; the org posture
# catalog, pangea-architectures workspaces/pleme-io-opensource/org.yaml,
# declares `visibility: public`), and on the GitHub Free plan an org secret
# reaches public repos. No repo-level secret is needed, and the catalog
# declares none (`actions_secrets: []`). If engenho is ever made private, the
# fix is an `actions_secrets` row in that catalog, never `gh secret set` (★★
# PLATFORM-MEDIATED INFRASTRUCTURE).
#
# The test leg's reds, identical in both runs: 7 tests in 4 binaries.
#   * 3 need a `nix` binary the runner did not have. Each panicked with
#     `could not run nix ...: No such file or directory`:
#       engenho-kubelet --test native_runs_a_real_closure   (2 tests)
#       engenho-kubelet --test native_runs_postgres         (1 test)
#     They fail rather than skip on purpose: they are the only tests that run
#     a real native process. Nix is now installed before the test leg, through
#     pleme-io/actions/nix-setup (below).
#   * 4 fail graceful shutdown with `StoreStillShared { strong_count: 2 }`:
#       engenho-runtime --test m0_1_single_node_convergence (1 test)
#       engenho-runtime --test m0_6_namespaced_reconcile    (3 tests)
#     A second holder of the store outlives shutdown. That is a code defect
#     (improvement plan T2.1), not a CI problem.
# Expected next run: red only on those two engenho-runtime binaries. Any other
# red is a new finding, to be recorded rather than skipped.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Load-bearing: makes cargo shell out to the real git binary, which honours
  # the `url.insteadOf` rewrite that `git-credentials` installs. Cargo's
  # bundled libgit2 backend does NOT honour it, so without this the private
  # deps stay unfetchable even with a valid PAT.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The gate. One job, whole workspace, compiled AND executed.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: cargo test (workspace, all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuse of the fleet primitive, not a hand-rolled two-liner. It owns the
      # BOT_PAT > GITHUB_TOKEN order AND the checkout-`extraheader` unset that
      # actually makes the rewrite take effect — getting that second part wrong
      # looks identical to having no fix at all.
      - uses: pleme-io/actions/git-credentials@main
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu

      # ── Compile-only leg for the live-oracle crate ──────────────────────
      # engenho-diff's four integration binaries each drive a REAL Kubernetes
      # oracle cluster to diff against. No oracle exists on a runner, so
      # .config/nextest.toml keeps them out of EXECUTION below, but their code
      # must still compile on every PR. The nextest leg builds them too; this
      # step stays deliberately FIRST so a compile break in the crate fails
      # fast and by name. It is the check that catches a crate silently falling
      # out of every build path and rotting, which this repo already had (see
      # CLAUDE.md § CI + gating).
      - name: compile engenho-diff (live-oracle crate — compiled, not run)
        run: cargo test -p engenho-diff --all-targets --all-features --locked --no-run

      # ── Nix on the runner: the test runner AND three tests need it ──────
      # Two consumers, so this step must stay BEFORE the nextest leg:
      #   1. nextest itself, fetched from substrate's pin below, the same
      #      `github:pleme-io/substrate#cargo-nextest` that substrate's
      #      rust-auto-release test gate runs. Both gates therefore run one
      #      nextest build over one selection file, .config/nextest.toml.
      #   2. engenho-kubelet's native_runs_a_real_closure (2 tests) and
      #      native_runs_postgres (1 test), which realise their closures with
      #      a real `nix build`. Without Nix they fail with `could not run nix
      #      ...: No such file or directory` (run 35418242848).
      # The install is pleme-io/actions/nix-setup, the shared copy of this
      # step (pinned installer, `sandbox = relaxed`, access-tokens), not a
      # third inline one. The token is only rate-limit headroom here: every
      # flake fetched is public (substrate, its pleme-io inputs skill-lint and
      # tatara-lisp, nixpkgs). The `||` fallback is the release gate's own.
      # `nix profile install` lands the binary in ~/.nix-profile/bin, which
      # the installer has already put on PATH, so the leg below is the same
      # `cargo nextest run` a developer types locally.
      - uses: pleme-io/actions/nix-setup@main
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
      - name: install substrate's pinned cargo-nextest
        run: nix profile install github:pleme-io/substrate#cargo-nextest

      # ── The executing gate ──────────────────────────────────────────────
      # WHICH tests run is decided by .config/nextest.toml, not by a flag on
      # this line: its default-filter skips the four named live-oracle
      # binaries and runs everything else, engenho-diff's mocked unit tests
      # included. The release gate reads the same file without being told to,
      # so the two gates can no longer disagree about WHICH tests are in scope
      # (they still differ in features: the release gate runs defaults). This
      # leg is also the regression test of that file: if the filter is lost,
      # the oracle binaries run on a runner with no oracle and fail here.
      # --all-features is LOAD-BEARING here, not decoration. engenho gates real
      # code behind with-tameshi / with-sui-eval / with-shikumi / with-revoada /
      # with-engenho-kube-client / openapi-roundtrip / bit-repro / mock. Default
      # features leave all of it uncompiled and unrun.
      # --locked ensures a drifted Cargo.lock fails loudly instead of being
      # silently re-resolved.
      # --no-fail-fast is REQUIRED for an honest count. The config also sets
      # `fail-fast = false`; the flag stays so this line reads true without
      # the file. Under cargo test the run once aborted at `engenho-diff`
      # reporting 881 tests; the true figure with --no-fail-fast was 3,169.
      # --no-tests=fail is the release gate's anti-vacuity assertion: a run
      # that selects zero tests is red, never a vacuous green.
      - name: cargo nextest run --workspace --all-targets --all-features
        run: >-
          cargo nextest run --workspace --all-targets --all-features
          --locked --no-fail-fast --no-tests=fail

      # ── Doctests — a SEPARATE leg, on purpose ───────────────────────────
      # nextest does not run doctests at all, and `--all-targets` excludes them
      # under cargo test as well, so they stay on cargo. A gate built only on
      # the leg above ships green over a broken doctest; the sibling repo
      # iac-forge had exactly one real failure this week and the doctest leg
      # alone caught it (an inverted assert_ne! in a module example).
      # HONEST SCOPE, engenho as measured: 42 doctests, of which 41 are
      # ```ignore``` and exactly 1 executes. This leg is therefore close to a
      # vacuous guard TODAY — it is wired anyway so the next real doctest lands
      # guarded rather than unguarded, and so the 41 are visible as debt rather
      # than as coverage.
      - name: cargo test --doc
        run: cargo test --workspace --all-features --locked --doc --no-fail-fast

  # ───────────────────────────────────────────────────────────────────────────
  # Format + lint. Separate jobs so a fmt nit and a real test failure are
  # distinguishable at a glance instead of collapsing into one red X.
  # ───────────────────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No credentials needed: rustfmt parses source, it does not resolve deps.
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (pedantic + format-ban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/git-credentials@main
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-ubuntu
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # Nix on the runner, as a checked contract (improvement plan T0.1). Three
  # tests realise closures with a real `nix build`, and nextest is fetched
  # with nix, so every job that runs tests or calls nix must install Nix
  # first, and only through pleme-io/actions/nix-setup. ci/nix-on-runner.tlisp
  # reads every workflow in .github/workflows and fails on a direct
  # nix-installer-action or on a Nix-needing step with no nix-setup before it.
  # It is a separate job so a red here names the contract, not a test.
  # ───────────────────────────────────────────────────────────────────────────
  nix-on-runner:
    name: nix on the runner (workflow contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/tatara-script@main
        with:
          script-file: ci/nix-on-runner.tlisp

  # ───────────────────────────────────────────────────────────────────────────
  # Publish only after the gate, as a checked contract (improvement plan
  # T0.3a). release.yml moves `:latest` in one job, promote-latest, after
  # release-assets has waited on every publishing leg and found every asset.
  # ci/release-contract.tlisp reads release.yml and fails on a job that names
  # `latest`, an image-push call that leaves `tag` or `additionalTags` at
  # their `latest` defaults, a publishing job release-assets does not wait
  # on, or a job its catalog does not know. Its tests,
  # ci/release-contract.test.tlisp, run in ci-contract-tests below.
  # ───────────────────────────────────────────────────────────────────────────
  release-contract:
    name: release publishes after the gate (workflow contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/tatara-script@main
        with:
          script-file: ci/release-contract.tlisp
          version: v0.3.58

  # ───────────────────────────────────────────────────────────────────────────
  # The mutation gate's lists, and every ci/*.test.tlisp (improvement plan
  # T0.6). The release-contract suite used to run in the job above; it runs
  # here now, beside mutation-gate's.
  # First step: ci/mutation-gate.tlisp in lint mode. ci/seam-files.txt must
  # name repo-relative .rs files that exist, each once; every row of
  # ci/mutants-allowlist.txt needs a `# why:` reason and a seam's path. A seam
  # renamed without updating the list fails here, on every push, instead of
  # leaving that file silently unmutated. The mutation runs themselves are
  # .github/workflows/mutation.yml.
  # Second step: pleme-io/actions/tlisp-test runs each ci/<name>.test.tlisp
  # against ci/<name>.tlisp. min-files is the number of suites that exist
  # (release-contract, mutation-gate, cargo-profiles), so losing one is red,
  # not a smaller green; mutation-gate's suite fails if the floor and the
  # count disagree. The first step pins the tatara-script tlisp-test reuses
  # from PATH.
  # cargo-profiles has no job of its own: its suite's first test runs the
  # whole check against the real Cargo.toml, .cargo/config.toml and every
  # workflow (improvement plan T0.9). It fails if [profile.release] leaves
  # opt-level 3, the level the Nix-built daemon is compiled at; if
  # [profile.stress] stops declaring opt-level 3 with debug assertions and
  # overflow checks on; if a step that raises PROPTEST_CASES builds with
  # `--release` or without the stress profile; or if a workflow env or a
  # cargo config overrides either profile from outside Cargo.toml.
  # ───────────────────────────────────────────────────────────────────────────
  ci-contract-tests:
    name: ci/*.test.tlisp + mutation-gate lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/tatara-script@main
        with:
          script-file: ci/mutation-gate.tlisp
          version: v0.3.58
        env:
          MUTATION_GATE_MODE: lint
      - uses: pleme-io/actions/tlisp-test@main
        with:
          min-files: 3
