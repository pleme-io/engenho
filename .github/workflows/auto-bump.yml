name: auto-bump

# On every push to main: bump workspace patch version, commit + tag,
# push. No shell — pure composition of three reusable pleme-io
# actions, each of which encapsulates its logic in Rust + tatara-lisp.
#
# Composes:
#   pleme-io/actions/rust-workspace-bump@v1   ← Rust+tlisp: cargo
#                                               set-version --workspace
#                                               --bump <type> + regen
#                                               Cargo.nix + skip when
#                                               no source changes
#   pleme-io/actions/git-commit-tag@v1        ← tlisp: bot identity +
#                                               stage + commit + tag
#   pleme-io/actions/git-push-with-token@v1   ← docker: push with PAT
#
# BOT_PAT (optional): a PAT with `repo` scope. If present, the tag
# push triggers downstream workflows. Without it, the tag still lands
# but the operator must trigger downstream via `gh workflow run`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - id: bump
        uses: pleme-io/actions/rust-workspace-bump@v1
        with:
          bump-type: ${{ inputs.bump-type || 'patch' }}
          source-paths: "engenho* Cargo.toml Cargo.lock"

      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-commit-tag@v1
        with:
          version: ${{ steps.bump.outputs.new-version }}
          add-paths: "Cargo.toml Cargo.lock Cargo.nix engenho-*/Cargo.toml engenho/Cargo.toml"

      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-push-with-token@v1
        with:
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          branch: main
          push-tags: "true"
