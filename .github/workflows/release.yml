name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.bin }}-${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        bin: [engenho-mcp, engenho-cluster-config-render]
        slug: [darwin-arm64, linux-x86_64, linux-arm64]
        include:
          - slug: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - slug: linux-x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binary
        run: |
          cargo build --release --bin ${{ matrix.bin }} --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/${{ matrix.bin }} ${{ matrix.bin }}-${{ matrix.slug }}
          shasum -a 256 ${{ matrix.bin }}-${{ matrix.slug }} > ${{ matrix.bin }}-${{ matrix.slug }}.sha256

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-${{ matrix.slug }}
          path: |
            ${{ matrix.bin }}-${{ matrix.slug }}
            ${{ matrix.bin }}-${{ matrix.slug }}.sha256

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artefact tree
        run: |
          mkdir -p release
          find dist -type f \
            \( -name 'engenho-mcp-*' \
            -o -name 'engenho-mcp-*.sha256' \
            -o -name 'engenho-cluster-config-render-*' \
            -o -name 'engenho-cluster-config-render-*.sha256' \) \
            -exec cp {} release/ \;

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true

  docker-publish:
    name: docker-publish-${{ matrix.bin }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        bin: [engenho-mcp, engenho-cluster-config-render]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build + push multi-arch image (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.bin }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pleme-io/${{ matrix.bin }}:${{ steps.version.outputs.version }}
            ghcr.io/pleme-io/${{ matrix.bin }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/pleme-io/engenho
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,scope=${{ matrix.bin }},mode=max
