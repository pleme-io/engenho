name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.bin }}-${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        bin: [engenho-mcp, engenho-cluster-config-render]
        slug: [darwin-arm64, linux-x86_64, linux-arm64]
        include:
          - slug: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - slug: linux-x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binary
        run: |
          cargo build --release --bin ${{ matrix.bin }} --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/${{ matrix.bin }} ${{ matrix.bin }}-${{ matrix.slug }}
          shasum -a 256 ${{ matrix.bin }}-${{ matrix.slug }} > ${{ matrix.bin }}-${{ matrix.slug }}.sha256

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-${{ matrix.slug }}
          path: |
            ${{ matrix.bin }}-${{ matrix.slug }}
            ${{ matrix.bin }}-${{ matrix.slug }}.sha256

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artefact tree
        run: |
          mkdir -p release
          find dist -type f \
            \( -name 'engenho-mcp-*' \
            -o -name 'engenho-mcp-*.sha256' \
            -o -name 'engenho-cluster-config-render-*' \
            -o -name 'engenho-cluster-config-render-*.sha256' \) \
            -exec cp {} release/ \;

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true

  docker-publish:
    name: docker-publish-${{ matrix.bin }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Linux runner required — substrate's rust-tool-image-flake.nix
    # builds Linux containers via crate2nix + nixpkgs.dockerTools.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        bin: [engenho-mcp, engenho-cluster-config-render]
    env:
      # forge consumes these for ghcr.io push. GITHUB_TOKEN has
      # packages:write on the workflow scope; no PAT needed.
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run substrate-driven release app
        # `nix run .#release-${{ matrix.bin }}` is generated by the
        # substrate's rust-tool-image-flake.nix function. It builds
        # multi-arch (amd64+arm64) container images via crate2nix +
        # nixpkgs.dockerTools and pushes to
        # ghcr.io/pleme-io/${matrix.bin}:{:version, :latest} via forge.
        # Zero Dockerfiles in the repo — substrate functions take
        # care of entire layers; single images are just edge
        # configurations of those functions.
        run: nix run .#release-${{ matrix.bin }}
