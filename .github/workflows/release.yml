name: release

# Tag-triggered (v*). Every publishing job but image-manifest is a thin
# caller of a substrate reusable workflow — per the org's prime directive
# (any pattern ≥2 sites → extract to substrate). Engenho ships:
#
#   * 2 Rust binaries  →  rust-binary-release.yml (one job per binary),
#                         artifact-only: built here, published by
#                         publish-release
#   * 4 OCI images     →  image-push.yml (one job per binary × arch)
#   * 2 multi-arch indexes → image-manifest (inline, below)
#   * 1 Helm chart     →  helm-chart-release.yml
#
# ── PUBLISH ONLY AFTER THE GATE (improvement plan T0.3) ───────────────────
# Nothing becomes "the release" until every leg is green and every asset the
# release promises exists:
#
#   binary-* (artifact-only) ─┐
#   image-*  (:<tag>-<arch>) ─┤
#   image-manifest (:<tag>)  ─┼─► release-assets ─► publish-release ─► promote-latest
#   chart    (:<version>)    ─┘   (checks all 23)   (GitHub Release)    (:latest)
#
# The binary jobs run rust-binary-release.yml with `artifact-only: true`. In
# its default mode every build leg attaches its own files to the tag's GitHub
# Release as soon as that leg finishes; the first leg creates the release and
# it becomes Latest with nothing checked. Receipt: run 35396851404 (v0.53.117)
# published the release at 21:33:49 UTC, one second after the engenho-mcp
# linux-x86_64 leg uploaded, and it ended with 12 of 16 binaries: both
# linux-aarch64 legs, all four image pushes and the chart had failed. The
# default mode also uploads a `linux-x86_64-binary` artifact from both binary
# jobs of one run, and the second upload of that name conflicts.
#
# Now each binary job leaves one workflow artifact (its `artifact-name`
# output). release-assets downloads both into release-files/ and
# ci/release-contract.tlisp (verify mode) looks up every asset: the 16 files
# there (each binary against its .sha256), the 4 arch images, the 2 indexes
# and the chart. publish-release then creates the GitHub Release in one call,
# with exactly the files release-assets checked, and promote-latest moves
# :latest on exactly the images it checked.
#
# `package:` on the binary jobs (improvement plan T0.8). `--bin` alone builds
# one binary but cargo still unifies features across every workspace member,
# and sui-store asks reqwest for its default (native-tls) features, so
# openssl-sys reached engenho-mcp's aarch64 legs (the improvement plan names
# it as why both failed). With
# `-p <package>` features resolve for that package alone: `cargo tree -p
# engenho-mcp -e normal --target aarch64-unknown-linux-gnu -i openssl-sys`
# finds no openssl-sys, while the same query over --workspace finds it.
#
# ci/release-contract.tlisp holds that contract. test.yml runs it on every
# push (job release-contract), so a binary job that leaves artifact-only or
# drops its package, a second writer of the GitHub Release, a new `latest`, a
# dropped `needs` or a new publishing job with no row in its catalog fails
# before merge; release-assets runs it again in verify mode, against the real
# release.
#
# `secrets: inherit` is required — reusable workflows don't
# auto-inherit GITHUB_TOKEN unless we propagate it explicitly.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version informational; Cargo.toml is source of truth'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ============================================================
  #   Cross-arch Rust binaries → one workflow artifact each
  #
  #   artifact-only: no leg touches the GitHub Release. Each job's
  #   `artifact-name` output names one artifact holding all four
  #   legs' binaries and .sha256 files, flat; it is empty unless
  #   every leg and the linux baseline passed. publish-release is
  #   the only job that creates the release.
  # ============================================================
  binary-engenho-mcp:
    name: binary engenho-mcp → workflow artifact
    uses: pleme-io/substrate/.github/workflows/rust-binary-release.yml@main
    with:
      binary-name: engenho-mcp
      # -p: features resolve for this package alone (see the header).
      package: engenho-mcp
      artifact-only: true
    secrets: inherit

  binary-engenho-cluster-config-render:
    name: binary engenho-cluster-config-render → workflow artifact
    uses: pleme-io/substrate/.github/workflows/rust-binary-release.yml@main
    with:
      binary-name: engenho-cluster-config-render
      package: engenho-cluster-config-render
      artifact-only: true
    secrets: inherit

  # ============================================================
  #   Multi-arch OCI images → ghcr.io/pleme-io/*
  #
  #   Each substrate image-push.yml call publishes ONE arch via
  #   nix build + forge/skopeo. We publish both amd64 + arm64 per
  #   binary; the multi-arch manifest is created by a tiny
  #   manifest-create job after all arches are pushed.
  # ============================================================
  image-engenho-mcp-amd64:
    name: image engenho-mcp/amd64 → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: engenho-mcp-image-amd64
      imageName: pleme-io/engenho-mcp
      tag: ${{ github.ref_name }}-amd64
      # image-push.yml defaults this to "latest". Only promote-latest
      # moves :latest (see the header).
      additionalTags: ''
    secrets: inherit

  image-engenho-mcp-arm64:
    name: image engenho-mcp/arm64 → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: engenho-mcp-image-arm64
      imageName: pleme-io/engenho-mcp
      tag: ${{ github.ref_name }}-arm64
      # image-push.yml defaults this to "latest". Only promote-latest
      # moves :latest (see the header).
      additionalTags: ''
      # Native aarch64-linux runner — `nix build` targets the runner's
      # own system, so this resolves `packages.aarch64-linux.*` (a real
      # derivation) instead of `packages.x86_64-linux.*` on the default
      # amd64 runner, which would need a foreign aarch64-linux builder
      # this repo has none configured for.
      runner: ubuntu-24.04-arm
    secrets: inherit

  image-engenho-cluster-config-render-amd64:
    name: image engenho-cluster-config-render/amd64 → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: engenho-cluster-config-render-image-amd64
      imageName: pleme-io/engenho-cluster-config-render
      tag: ${{ github.ref_name }}-amd64
      # image-push.yml defaults this to "latest". Only promote-latest
      # moves :latest (see the header).
      additionalTags: ''
    secrets: inherit

  image-engenho-cluster-config-render-arm64:
    name: image engenho-cluster-config-render/arm64 → ghcr.io
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: engenho-cluster-config-render-image-arm64
      imageName: pleme-io/engenho-cluster-config-render
      tag: ${{ github.ref_name }}-arm64
      # image-push.yml defaults this to "latest". Only promote-latest
      # moves :latest (see the header).
      additionalTags: ''
      # See image-engenho-mcp-arm64's comment — native aarch64-linux
      # runner so `nix build` resolves `packages.aarch64-linux.*`.
      runner: ubuntu-24.04-arm
    secrets: inherit

  # ============================================================
  #   Multi-arch manifest creation
  #
  #   Combines the per-arch tags above into a single
  #   :{tag} index that auto-selects the right arch on docker pull.
  #   The arch-suffixed tags remain available for explicit pulls.
  #
  #   This step uses `docker buildx imagetools create` — minimal +
  #   stateless. A future substrate enhancement may extract this to
  #   image-manifest.yml as a reusable workflow.
  # ============================================================
  image-manifest:
    name: multi-arch manifests → ghcr.io
    needs:
      - image-engenho-mcp-amd64
      - image-engenho-mcp-arm64
      - image-engenho-cluster-config-render-amd64
      - image-engenho-cluster-config-render-arm64
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        bin: [engenho-mcp, engenho-cluster-config-render]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:<tag>` only. promote-latest moves `:latest` once every leg is green
      # and every asset exists.
      - name: Combine arch tags into a single manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/pleme-io/${{ matrix.bin }}:${{ github.ref_name }} \
            ghcr.io/pleme-io/${{ matrix.bin }}:${{ github.ref_name }}-amd64 \
            ghcr.io/pleme-io/${{ matrix.bin }}:${{ github.ref_name }}-arm64

  # ============================================================
  #   Helm chart → ghcr.io/pleme-io/engenho/charts (OCI)
  # ============================================================
  chart:
    name: Helm chart → ghcr.io OCI
    uses: pleme-io/substrate/.github/workflows/helm-chart-release.yml@main
    with:
      chart-path: ./charts/engenho
      oci-registry: oci://ghcr.io/pleme-io/engenho/charts
    secrets: inherit

  # ============================================================
  #   The gate (improvement plan T0.3)
  #
  #   release-assets needs every publishing job, so it runs only when all
  #   of them succeeded, and only for a v* tag (a branch dispatch never
  #   publishes). A green leg is not proof of its assets, so
  #   ci/release-contract.tlisp (verify mode) derives every asset the
  #   release promises from THIS file and looks each one up: the binary
  #   files in release-files/ (downloaded below, each binary checked
  #   against its .sha256), the images, indexes and chart by OCI ref. Any
  #   missing asset or checksum mismatch fails the job; nothing has been
  #   published to the GitHub Release and :latest stays where it was.
  #
  #   Its two outputs are what the next jobs publish: `files` (the staged
  #   paths it checked) and `images` (the image repos it checked).
  # ============================================================
  release-assets:
    name: every release asset exists
    needs:
      - binary-engenho-mcp
      - binary-engenho-cluster-config-render
      - image-engenho-mcp-amd64
      - image-engenho-mcp-arm64
      - image-engenho-cluster-config-render-amd64
      - image-engenho-cluster-config-render-arm64
      - image-manifest
      - chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.verify.outputs.matrix }}
      files: ${{ steps.verify.outputs.files }}
    steps:
      - uses: actions/checkout@v4

      - name: Download engenho-mcp's binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binary-engenho-mcp.outputs.artifact-name }}
          path: release-files

      - name: Download engenho-cluster-config-render's binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binary-engenho-cluster-config-render.outputs.artifact-name }}
          path: release-files

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: verify
        uses: pleme-io/actions/tatara-script@main
        with:
          script-file: ci/release-contract.tlisp
          version: v0.3.58
        env:
          RELEASE_CONTRACT_MODE: verify
          RELEASE_TAG: ${{ github.ref_name }}

  # ============================================================
  #   The GitHub Release, once, from the checked files
  #
  #   The only job that writes a GitHub Release. It re-downloads the same
  #   run artifacts (immutable within the run) and hands gh-release-create
  #   exactly release-assets' `files` list. `if-exists: fail`: the default,
  #   `skip`, reports success on an existing release without uploading a
  #   file. `gh release create` with assets creates a draft, uploads every
  #   file, and publishes only after the last upload; a failed upload
  #   deletes the draft (cli/cli pkg/cmd/release/create/create.go,
  #   draftWhileUploading + cleanupDraftRelease), so the release is never
  #   public half-attached. That is gh's behaviour as read from its source,
  #   not a check this repo runs.
  # ============================================================
  publish-release:
    name: GitHub Release from the checked files
    needs:
      - release-assets
      - binary-engenho-mcp
      - binary-engenho-cluster-config-render
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download engenho-mcp's binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binary-engenho-mcp.outputs.artifact-name }}
          path: release-files

      - name: Download engenho-cluster-config-render's binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.binary-engenho-cluster-config-render.outputs.artifact-name }}
          path: release-files

      - uses: pleme-io/actions/gh-release-create@main
        with:
          tag: ${{ github.ref_name }}
          assets: ${{ needs.release-assets.outputs.files }}
          if-exists: fail

  # ============================================================
  #   :latest, after the GitHub Release exists
  #
  #   One matrix leg per image, from release-assets' output, so it moves
  #   exactly the images that were checked. It waits for publish-release
  #   too: an image is never :latest for a release that has no GitHub
  #   Release.
  # ============================================================
  promote-latest:
    name: promote ${{ matrix.image }} to :latest
    needs:
      - release-assets
      - publish-release
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release-assets.outputs.images) }}
    steps:
      - uses: pleme-io/actions/release-promote@main
        with:
          kind: image-retag
          image: ${{ matrix.image }}
          source-tag: ${{ github.ref_name }}
          target-tag: latest
