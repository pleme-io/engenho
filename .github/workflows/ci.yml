name: ci

# Thin shim — the real gate is .github/workflows/test.yml.
# This just evaluates the flake (catches eval errors) but does NOT
# compile or test any crates. See test.yml header for full rationale.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  flake-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check
        continue-on-error: true
