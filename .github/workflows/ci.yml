name: ci

# Thin shim — the real gate is .github/workflows/test.yml.
# This evaluates the flake and every check it declares, but builds none of
# them, so it does NOT compile or test any crates. See test.yml header for
# full rationale.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  flake-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The shared install step (pinned installer, `sandbox = relaxed`), not
      # an inline installer. See pleme-io/actions/nix-setup/action.yml.
      - uses: pleme-io/actions/nix-setup@main

      # ── THE FATAL GATE — the delta-freshness tie ────────────────────────
      # `gen confirm` is a pure OFFLINE check: it recomputes sha256(Cargo.lock)
      # and compares it to the `cargo_lock_sha256` recorded in the committed
      # Cargo.gen.lock (the D2 tie). No cargo metadata, no network, no
      # ~/.cargo, nothing environmental to get wrong.
      #
      # COST, measured rather than assumed: the CHECK is instant, but OBTAINING
      # it is not — `pleme-io/gen` publishes no release binaries, and this
      # runner has no pleme binary cache, so `nix run` compiles gen from source
      # on a cold runner (observed building anstyle-parse, arc-swap, … before
      # being cut off). Budget minutes, not seconds. That is still the right
      # trade against a defect that broke four machines in one evening — but it
      # is a real cost, and the honest fix is to publish gen binaries via
      # auto-release and pin one here, at which point this step is instant.
      #
      # WHY IT IS FATAL, measured 2026-08-04/05. A Cargo.lock that moves
      # without a matching `gen build` is not a lint nit here: every Nix
      # consumer of this workspace fails to EVAL — not build, EVAL — so the
      # break reaches machines that never asked for engenho. It happened
      # THREE times in one evening (fd54e5e, 3169392, and post-v0.53.7), each
      # time found by a human staring at a red fleet.
      #
      # It escaped because this job ran `nix flake check` with
      # `continue-on-error: true` — CI executed the check that would have
      # caught it, then discarded the verdict. The run at 2026-08-05T04:41Z
      # reports `conclusion: success` for a tree that was breaking the fleet
      # at that moment. A gate whose verdict is ignored is worse than no gate:
      # it manufactures confidence.
      #
      # Fix locally with: gen build && git commit Cargo.gen.lock
      - name: delta freshness (Cargo.lock <-> Cargo.gen.lock)
        run: nix run github:pleme-io/gen -- confirm

      # ── THE CHECK SURFACE, EVALUATED ON EVERY SYSTEM (fatal) ────────────
      # `--no-build` evaluates every `checks.<system>.*`, and `--all-systems`
      # does so for the darwin systems too, where ryn runs engenho. Nothing is
      # built. The step fails when:
      #   * one output layer in flake.nix replaces another's checks.
      #     `checks.<system>.flake-surface` throws at evaluation, naming the
      #     checks that went missing. A plain `//` between the layers had left
      #     `typed-config` as the flake's only check (integration item I36);
      #   * the module trio's typed options misbehave. `typed-config` asserts
      #     at evaluation;
      #   * substrate refuses the `tests.cargo` declaration, or
      #     .config/nextest.toml stops naming the live-oracle binaries that
      #     `checks.<system>.tests` skips.
      #
      # Why not build: `checks.build` compiles engenho through buildRustCrate,
      # and `checks.tests` compiles and runs the whole workspace's tests in a
      # ~17 GB target, more than this runner's disk. Neither is built here.
      # test.yml stays the compile-and-test gate until `checks.tests` is built
      # green on rio; then test.yml's cargo legs fold into `nix flake check`.
      #
      # This step used to be a plain `nix flake check` with
      # `continue-on-error: true`, a verdict CI computed and then discarded.
      # Evaluation is cheap and deterministic, so it is fatal now.
      - name: flake checks evaluate (every system, nothing built)
        run: nix flake check --no-build --all-systems
