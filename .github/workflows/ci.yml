name: ci

# Thin shim. Delegates the canonical cargo + nix flake check to
# substrate's reusable cargo-ci.yml. Per the prime directive (org
# CLAUDE.md), hand-authored composite actions are drift; this
# workflow is just edge config triggering the substrate primitive.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    uses: pleme-io/substrate/.github/workflows/cargo-ci.yml@main
    secrets: inherit
