[package]
name = "engenho-controllers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description = "engenho-controllers — the engenho K8s controller suite. Hosts the Controller trait + canonical implementations: ReplicaSetController (R9), DeploymentController (R9.5), ServiceController (R9.6), GC (R9.7). Each is a thin reconcile loop on engenho-store. Same shape as engenho-scheduler — the second-site for the controller pattern."

[dependencies]
async-trait        = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
anyhow             = { workspace = true }

engenho-types      = { workspace = true }
engenho-store      = { workspace = true }
engenho-config     = { workspace = true }
engenho-substrate  = { workspace = true }
# Convergence primitives — the reconcile loop classifies failures via the
# fleet-wide FailureKind classifier (Transient/Declarative) rather than a
# hand-rolled fork. Same crate engenho-types already re-exports FailureKind from.
shigoto-types      = { workspace = true }
blake3             = "1"
# base64 decode of a mutating webhook's RFC6902 JSONPatch response (the
# AdmissionReview v1 wire carries the patch base64-encoded).
base64             = "0.22"
# Calendar decomposition for the 5-field cron parser (CronJobController):
# unix-seconds → UTC (minute/hour/day/month/weekday) + RFC3339 round-trip of
# status.lastScheduleTime. Same crate (+ version) engenho-types already pulls;
# no new dependency closure (already in Cargo.lock).
chrono             = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
proptest = "1"
