[package]
name = "engenho-substrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
description = "engenho-substrate — the substrate leaf: every module a shipped engenho crate references (derivations and caches, receipts, quorum, ledgers, verifiers, rollout gates, freshness, owned tasks), with engenho-substrate-core re-exported whole so every engenho_substrate:: path keeps resolving."

[dependencies]
# The tokio-free core. Re-exported whole from lib.rs. The path + version
# pair is what `[workspace.dependencies]` would hold; it lives here until
# the root manifest lists the substrate family.
engenho-substrate-core = { path = "../engenho-substrate-core", version = "0.53.118" }
async-trait        = { workspace = true }
futures            = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["sync", "macros", "rt"] }
blake3             = "1"

[dev-dependencies]
tokio              = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread"] }
