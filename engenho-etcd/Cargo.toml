[package]
name = "engenho-etcd"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
readme.workspace       = true
categories.workspace   = true
keywords.workspace     = true
description = "etcd v3 wire façade for engenho. engenho does not run etcd and does not intend to — but the etcd INTERFACE is load-bearing even where the technology is not: etcdctl, backup/DR, Velero and every --etcd-servers consumer address a keyspace, not a database. This crate owns the /registry keyspace mapping and the vendored etcdserverpb wire definitions, so engenho's own journalled store can answer for etcd."

[lib]
path = "src/lib.rs"

[dependencies]
prost         = "0.14"
tonic         = { version = "0.14", default-features = false, features = ["router", "server", "codegen", "transport"] }
tonic-prost   = "0.14"
tokio          = { workspace = true }
tokio-stream   = "0.1"
async-stream   = "0.3"
bytes         = "1"
engenho-types = { path = "../engenho-types" }
engenho-store = { path = "../engenho-store" }
thiserror     = { workspace = true }

[build-dependencies]
protox       = "0.9"
prost-build  = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
