description = "etcd v3 wire façade for engenho. engenho does not run etcd and does not intend to — but the etcd INTERFACE is load-bearing even where the technology is not: etcdctl, backup/DR, Velero and every --etcd-servers consumer address a keyspace, not a database. This crate owns the /registry keyspace mapping and the vendored etcdserverpb wire definitions, so engenho's own journalled store can answer for etcd."

