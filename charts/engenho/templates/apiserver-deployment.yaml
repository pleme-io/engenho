{{- if .Values.apiserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "engenho.fullname" . }}-apiserver
  labels:
    {{- include "engenho.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: engenho
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "engenho.labels" . | nindent 8 }}
        app.kubernetes.io/component: apiserver
    spec:
      containers:
        - name: apiserver
          image: {{ list .Values.apiserver.image.repository . | include "engenho.image" }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - name: ENGENHO_CLUSTER
              value: {{ .Values.global.cluster.name | quote }}
            - name: ENGENHO_NATS_URL
              value: {{ include "engenho.natsURL" . | quote }}
            - name: ENGENHO_STORE_PEERS
              value: "{{ include "engenho.fullname" . }}-store.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.store.raft.port }}"
            - name: ENGENHO_HTTP_PORT
              value: {{ .Values.apiserver.http.port | quote }}
            {{- /* tieredConfig env tier (<PREFIX>_ overrides) + discovered tier
                   (POD_NAMESPACE/POD_NAME downward API) — declared, not assumed. */}}
            {{- include "pleme-lib.tieredConfig.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.apiserver.http.port }}
              protocol: TCP
            {{- if .Values.apiserver.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.apiserver.grpc.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.apiserver.graphql.enabled }}
            - name: graphql
              containerPort: {{ .Values.apiserver.graphql.port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          {{- if (((.Values.config).file).enabled) }}
          volumeMounts:
            {{- /* mount the file-tier ConfigMap at /etc/engenho so the
                   engenho-config ConfigStore discovers /etc/engenho/engenho.yaml */}}
            {{- include "pleme-lib.tieredConfig.volumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      {{- if (((.Values.config).file).enabled) }}
      volumes:
        {{- include "pleme-lib.tieredConfig.volume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "engenho.fullname" . }}-apiserver
  labels:
    {{- include "engenho.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
  {{- with .Values.apiserver.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.apiserver.service.type }}
  ports:
    - name: http
      port: {{ .Values.apiserver.http.port }}
      targetPort: http
    {{- if .Values.apiserver.grpc.enabled }}
    - name: grpc
      port: {{ .Values.apiserver.grpc.port }}
      targetPort: grpc
    {{- end }}
    {{- if .Values.apiserver.graphql.enabled }}
    - name: graphql
      port: {{ .Values.apiserver.graphql.port }}
      targetPort: graphql
    {{- end }}
  selector:
    app.kubernetes.io/name: engenho
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.apiserver.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "engenho.fullname" . }}-apiserver
  labels:
    {{- include "engenho.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.apiserver.ingress.className }}
  rules:
    {{- range .Values.apiserver.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "engenho.fullname" $ }}-apiserver
                port:
                  name: http
          {{- end }}
    {{- end }}
  {{- with .Values.apiserver.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
