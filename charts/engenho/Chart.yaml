apiVersion: v2
name: engenho
description: |
  Engenho — typed, attested, Rust-native Kubernetes runtime + distributed
  substrate. This umbrella chart deploys the full engenho stack with
  intelligent orchestrated bring-up:

    1. vector        — observability pipeline
    2. engenho-store — etcd-equivalent (3-replica openraft StatefulSet)
    3. engenho-revoada — per-node gossip + role policy (DaemonSet)
    4. engenho-apiserver — HTTP/gRPC/GraphQL K8s API (Deployment)

  No NATS: NATS is not engenho's fabric (docs/IMPROVEMENT-PLAN.md §5.1).
  The fabric is in-binary (`fabric: in_binary` in EngenhoConfig); the
  NATS client in engenho-teia is fenced behind the `teia-nats` cargo
  feature, off by default, and this chart deploys no broker for it.

  Designed for FluxCD orchestration — components declare their
  dependencies via Helm chart subchart deps + FluxCD HelmRelease
  dependsOn fields. See flux/engenho-stack/ for the rollout manifest.

  Companion docs: docs/FABRIC.md, docs/DISTRIBUTED.md, docs/API-SURFACE.md
type: application
version: 0.7.0
appVersion: "0.6.0"
keywords:
  - kubernetes
  - distributed
  - raft
  - attestation
home: https://github.com/pleme-io/engenho
sources:
  - https://github.com/pleme-io/engenho
maintainers:
  - name: pleme-io
    url: https://github.com/pleme-io

dependencies:
  - name: vector
    version: "0.40.x"
    repository: https://helm.vector.dev
    condition: vector.enabled
  # pleme-lib provides the tieredConfig mixin (config-as-reconciled-Helm):
  # the file-tier ConfigMap the engenho-config ConfigStore discovers +
  # hot-reloads at /etc/engenho/engenho.yaml. Floor-only pin; resolved at
  # release time from the pleme-io OCI registry.
  - name: pleme-lib
    version: ">=0.39.0"
    repository: "oci://ghcr.io/pleme-io/charts"
